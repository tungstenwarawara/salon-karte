version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      # React系: react と react-dom は常に同じバージョンにする必要がある
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"

      # 開発ツール系: まとめて1PRにする
      dev-dependencies:
        dependency-type: "development"
        patterns:
          - "@types/*"
          - "eslint*"
          - "@eslint/*"
          - "vitest"
          - "@vitest/*"
          - "tailwindcss"
          - "@tailwindcss/*"
          - "tsx"
          - "typescript"
          - "dotenv"

      # モニタリング系: まとめて1PR
      monitoring:
        patterns:
          - "@sentry/*"
          - "@vercel/*"
