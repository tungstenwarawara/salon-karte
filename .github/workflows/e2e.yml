name: E2E

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同じブランチの E2E は順番に実行する。
# 別の PR とは同時に走りうるが、CI ではスモーク（読み取りのみ）しか流さないため
# テストサロンのデータは書き換えない。
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    # ubuntu-latest（26.04）では `playwright install --with-deps` が依存パッケージ185個（142MB）を
    # apt で取得するが、ミラーが約50KB/sしか出ず20分のタイムアウトに達した（2026-10-27）。
    # 24.04 のイメージには依存の大半が入っており1〜2分で終わるため、E2E だけ 24.04 に固定する。
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      # 未登録だと dev サーバーが 500 を返し、webServer の起動待ちで120秒タイムアウトするだけになる
      - name: Check required secrets
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::Actions secrets に NEXT_PUBLIC_SUPABASE_URL と NEXT_PUBLIC_SUPABASE_ANON_KEY を登録してください"
            exit 1
          fi
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # CI ではスモーク（ログイン + 主要ページ表示、desktop-chromium のみ）に絞る。
      # フル実行はテスト間のデータ汚染で構造的に落ちるテストがあり、20分にも収まらないため、
      # 必要に応じてローカルで `npm run test:e2e:reset` を使う。
      - name: Run E2E smoke tests
        run: npm run test:e2e:smoke
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # 未登録なら空文字になり、e2e/fixtures/auth.ts の既定値（テストサロン）が使われる
          PLAYWRIGHT_TEST_EMAIL: ${{ secrets.PLAYWRIGHT_TEST_EMAIL }}
          PLAYWRIGHT_TEST_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}
          # Webhook 系・決済系は CI では未設定でビルド可能（dev サーバー起動用）

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
